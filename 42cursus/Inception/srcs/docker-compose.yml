version: '3'

volumes:
  mariadb-volume:
    name: mariadb-volume
    driver: local
    driver_opts:
      device: /home/hanryu/data/mariadb
      o: bind
      type: none
  wordpress-volume:
    name: wordpress-volume
    driver: local
    driver_opts:
      device: /home/hanryu/data/wordpress
      o: bind
      type: none
services:
  mariadb:
    image: mariadb
    pull_policy: never
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb-volume:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - inception
    env_file: .env
    tty: true
    restart: always
  wordpress:
    image: wordpress
    pull_policy: never
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    volumes:
      - wordpress-volume:/var/www/html
    expose:
      - "9000"
    networks:
      - inception
    env_file: .env
    tty: true
    restart: always
  nginx:
    image: nginx
    pull_policy: never
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress
    volumes:
      - wordpress-volume:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception
    env_file: .env
    tty: true
    restart: always
networks:
  inception:
    driver: bridge