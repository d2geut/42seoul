verison: '3'

volumes:
  mariadb-volume:
    name: mariadb-volume
    driver: local
    driver_opts:
      device: /home/hanryu/data/mariadb
      o: bind
      type: none
  wordpress-volume:
    name: wordpress-volume
    driver: local
    driver_opts:
      device: /home/hanryu/data/wordpress
      o: bind
      type: none
services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb-volume:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - inception
    env_file: .env
    tty: true
    restart: always
  wordpress:
  nginx:
networks:
  inception:
    driver: bridge